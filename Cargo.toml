[package]
name = "pwd_manager"
version = "0.1.0"
edition = "2024"
include = ["src/**/*", "Cargo.toml", "*.md", "scripts/**/*", "tests/**/*"]
homepage = "https://github.com/seanzian2093/rust_pwd_manager"
description = "A command line tool to encrypt and decrypt passwords, security question, etc."
repository = "https://github.com/seanzian2093/rust_pwd_manager"
keywords = ["command-line-utilities", "security"]
categories = ["security", "command-line"]
license = "MIT"
rust-version = "1.98.1"
authors = ["Sean Zian"]

[badges]
maintenance = { status = "actively-developed"}

[dependencies]
chacha20poly1305 = { version = "0.11.0" }
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }
redb ={ version = "4.3.0"}
rpassword = "7.5.4"
zeroize = { version = "1.9.0", features = ["serde"] }
ciborium = "0.2.2"
argon2 = "0.5"

[dev-dependencies]
assert_cmd = "2"
proptest = "1"
